# Verana 配置文件
# 支持两个模型角色:composer(生成)和 evaluator(评测),必须不同模型(设计文档第 8 节)
# LLM client 用 Anthropic 原生 Messages API(/v1/messages, x-api-key, anthropic-version)
# 复制本文件为 verana.config.yaml 并填入你的配置

composer:
  base_url: "http://your-gateway/anthropic"
  model: "ppio/pa/claude-opus-4-8"
  api_key: "sk-xxx"

evaluator:
  base_url: "http://your-gateway/anthropic"
  model: "pa/claude-sonnet-5"
  api_key: "sk-xxx"
